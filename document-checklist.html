<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서류 준비 체크리스트</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="mobile-app">
    <header class="page-title-header">
        <a href="notice-detail.html" class="back-button">‹</a>
        <h1>서류 준비 체크리스트</h1>
    </header>

    <main class="document-content">
        <section class="document-card">
            <span class="eyebrow">내가 직접 제출</span>
            <h2>신청 전에 준비할 서류</h2>

            <div class="document-row">
                <button type="button" class="check-button document-check-button checked">✓</button>
                <strong>주민등록등본</strong>
                <span class="document-state">본인 제출</span>
            </div>

            <div class="document-row">
                <button type="button" class="check-button document-check-button"></button>
                <strong>소득증빙서류</strong>
                <span class="document-state">확인 필요</span>
            </div>
        </section>

        <div class="document-progress">
            <div class="progress-track">
                <div class="progress-fill" id="document-progress-fill"></div>
            </div>
            <div class="progress-text">
                <strong id="document-progress-text">1 / 2</strong> 전체 진행률
            </div>
        </div>

        <section class="document-card">
            <span class="eyebrow">확인 해야할 것</span>
            <h2>가족 서명이 필요해요</h2>
            <div class="media-slot document-slot"></div>
        </section>

        <button type="button" class="primary-button document-request-button" id="share-open">
            가족에게 서류 요청보내기
        </button>
    </main>

    <div id="footer"></div>

    <div class="modal-overlay" id="share-modal">
        <div class="bottom-sheet">
            <div class="drag-handle"></div>
            <div class="sheet-header">
                <div>
                    <span class="eyebrow">보내는 방법 선택하기</span>
                    <h2>가족에게 어떻게 보낼까요?</h2>
                    <p style="margin:6px 0 0;color:#777;font-size:10px;">앱 없이도 링크로 바로 서명할 수 있어요</p>
                </div>
                <button type="button" class="sheet-close" data-modal-close>×</button>
            </div>

            <div style="margin-top:21px;">
                <a href="signature-request.html" class="share-method"><span class="media-slot icon-slot"></span>카카오톡으로 보내기</a>
                <a href="signature-request.html" class="share-method"><span class="media-slot icon-slot"></span>문자로 보내기</a>
                <a href="signature-request.html" class="share-method"><span class="media-slot icon-slot"></span>링크 복사하기</a>
            </div>
        </div>
    </div>
</div>

    <script src="./js/app.js"></script>
    <script src="./js/header.js"></script>
    <script src="./js/footer.js"></script>

</body>
</html>
