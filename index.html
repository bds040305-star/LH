<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LH 청약+ - 홈</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="mobile-app">
    <div id="header"></div>

    <main class="page-main home-content">
        <section class="home-hero">
            <span class="eyebrow">내 집 마련 여정</span>
            <h1>오늘도 내 집 마련을<br><span>차근차근 준비해요</span></h1>
            <p>나에게 맞는 공고를 빠르게 찾아보세요</p>
        </section>

        <section class="card home-card">
            <div class="home-card-head">
                <span class="eyebrow">내 조건에 맞는 공고</span>
                <a href="custom-conditions.html">조건 편집 <img src="https://bds040305-star.github.io/LH/images/icon/arrow-gray-right.svg" alt=""></a>
            </div>
            <h2>지금 신청할 수 있어요</h2>
            <div class="home-stats">
                <div class="home-stat">
                    <span class="label">신청 가능</span>
                    <strong>3<small>건</small></strong>
                </div>
                <div class="home-stat orange">
                    <span class="label">마감 임박</span>
                    <strong>1<small>건</small></strong>
                </div>
            </div>
            <a href="custom-list.html" class="primary-button">공고 확인하기</a>
        </section>

        <section class="card home-card">
            <div class="home-card-head">
                <span class="eyebrow">신청 준비</span>
                <a href="schedule.html">전체보기 <img src="https://bds040305-star.github.io/LH/images/icon/arrow-gray-right.svg" alt=""></a>
            </div>
            <h2>오늘 해야 할 일</h2>
            <div class="todo-list">
                <div class="todo-row">
                    <!-- 체크 아이콘 변경 필요 -->
                    <button type="button" class="check-button checked"><img src="https://bds040305-star.github.io/LH/images/icon/check.svg" alt=""></button>
                    <span>서류 준비 항목</span>
                </div>
                <div class="todo-row">
                    <button type="button" class="check-button"><img src="https://bds040305-star.github.io/LH/images/icon/check.svg" alt=""></button>
                    <span>관심 공고 마감 <strong style="color:#0066B3;">D-2</strong></span>
                </div>
            </div>
        </section>

        <section class="card home-card">
            <span class="eyebrow">저장해 두기</span>
            <h2>관심 공고</h2>
            <div class="interest-empty">관심 공고를 추가해 보세요</div>
        </section>
    </main>

    <div id="footer"></div>

    <div class="modal-overlay" id="quick-menu">
        <div class="bottom-sheet">
            <div class="drag-handle"></div>
            <div class="sheet-header">
                <div>
                    <span class="eyebrow">빠른 메뉴</span>
                    <h2>무엇을 도와드릴까요?</h2>
                </div>
                <button type="button" class="sheet-close" data-modal-close>×</button>
            </div>

            <div class="quick-grid">
                <a href="custom-conditions.html" class="quick-card">
                    <span class="media-slot quick-icon-slot"><img src="https://bds040305-star.github.io/LH/images/main-popup-icon/filter.svg" alt=""></span>
                    <strong>맞춤 조건 설정</strong>
                    <p>내 조건에 맞는 공고</p>
                </a>
                <a href="schedule.html" class="quick-card">
                    <span class="media-slot quick-icon-slot"><img src="https://bds040305-star.github.io/LH/images/main-popup-icon/cal.svg" alt=""></span>
                    <strong>청약 일정</strong>
                    <p>내 일정 한눈에 보기</p>
                </a>
                <a href="document-checklist.html" class="quick-card">
                    <span class="media-slot quick-icon-slot"><img src="https://bds040305-star.github.io/LH/images/main-popup-icon/paper.svg" alt=""></span>
                    <strong>청약 가이드</strong>
                    <p>처음이라면 읽어보세요</p>
                </a>
                <button type="button" class="quick-card quick-card-button" id="home-help">
                    <span class="media-slot quick-icon-slot"><img src="https://bds040305-star.github.io/LH/images/main-popup-icon/qua.svg" alt=""></span>
                    <strong>도움말</strong>
                    <p>궁금한 점을 찾아보기</p>
                </button>
            </div>
        </div>
    </div>
</div>

    <script src="https://bds040305-star.github.io/LH/js/app.js"></script>
    <script src="https://bds040305-star.github.io/LH/js/header.js"></script>
    <script src="https://bds040305-star.github.io/LH/js/footer.js"></script>

</body>
</html>
