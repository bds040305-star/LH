<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산맵</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="mobile-app">
    <main class="map-content">
        <h1>부동산맵</h1>
        <span class="eyebrow">주변 정보</span>

        <div class="map-slot map-placeholder" aria-label="주변 임대주택 위치 지도">
            <span class="map-road road-one"></span>
            <span class="map-road road-two"></span>
            <span class="map-river"></span>
            <span class="map-pin pin-one" aria-hidden="true"></span>
            <span class="map-pin pin-two" aria-hidden="true"></span>
            <span class="map-me">현재 위치</span>
        </div>

        <div class="map-filter-row">
            <button type="button" class="map-filter-button active" data-filter="match" aria-pressed="true">내 조건만 보기</button>
            <button type="button" class="map-filter-button" data-filter="all" aria-pressed="false">전체 보기</button>
        </div>

        <a href="notice-detail.html" class="map-card" data-match="true">
            <img class="map-card-icon" src="https://bds040305-star.github.io/LH/images/icon/pin.svg" alt="">
            <div>
                <strong>수원시 청년 매입임대</strong>
                <p>현재 위치 2.1km</p>
            </div>
            <span class="arrow">›</span>
        </a>

        <a href="notice-detail.html" class="map-card" data-match="true">
            <img class="map-card-icon" src="https://bds040305-star.github.io/LH/images/icon/pin.svg" alt="">
            <div>
                <strong>성남시 매입임대 신규</strong>
                <p>현재 위치 5.4km</p>
            </div>
            <span class="arrow">›</span>
        </a>

        <a href="notice-detail.html" class="map-card is-hidden" data-match="false">
            <img class="map-card-icon" src="https://bds040305-star.github.io/LH/images/icon/pin.svg" alt="">
            <div>
                <strong>용인시 국민임대 예비입주자</strong>
                <p>현재 위치 8.7km</p>
            </div>
            <span class="arrow">›</span>
        </a>
    </main>

    <div id="footer"></div>
</div>

    <script src="https://bds040305-star.github.io/LH/js/app.js"></script>
    <script src="https://bds040305-star.github.io/LH/js/header.js"></script>
    <script src="https://bds040305-star.github.io/LH/js/footer.js"></script>

</body>
</html>
